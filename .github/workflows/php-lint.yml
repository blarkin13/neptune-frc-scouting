name: PHP Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Lint every PHP file
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found."
            exit 1
          fi

          printf 'Linting %d PHP files...
' "${#files[@]}"
          for file in "${files[@]}"; do
            php -l "$file" >/dev/null
          done

          echo "All PHP files passed php -l."
